<title>AscensorTech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F6F9FC;
  --sidebar:#0B1629; --sidebar2:#162035;
  --primary:#2563EB; --primary-d:#1D4ED8; --primary-s:#EFF6FF;
  --text-1:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --border:#E2E8F0; --border2:#CBD5E1;
  --success:#10B981; --success-s:#D1FAE5;
  --warning:#F59E0B; --warning-s:#FEF3C7;
  --danger:#EF4444; --danger-s:#FEE2E2;
  --info:#3B82F6; --info-s:#DBEAFE;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px rgba(15,23,42,.10),0 2px 4px rgba(15,23,42,.06);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070E1C;--surface:#111827;--surface2:#1A2438;--sidebar:#030810;--sidebar2:#0B1629;
    --text-1:#F1F5F9;--text-2:#94A3B8;--text-3:#475569;--border:#1E2D45;--border2:#253350;
    --primary-s:#1E3A72;--success-s:#064E3B;--warning-s:#451A03;--danger-s:#450A0A;--info-s:#1E3A72;
    --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#070E1C;--surface:#111827;--surface2:#1A2438;--sidebar:#030810;--sidebar2:#0B1629;
  --text-1:#F1F5F9;--text-2:#94A3B8;--text-3:#475569;--border:#1E2D45;--border2:#253350;
  --primary-s:#1E3A72;--success-s:#064E3B;--warning-s:#451A03;--danger-s:#450A0A;--info-s:#1E3A72;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-icon{width:36px;height:36px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-brand{flex:1;min-width:0}
.sb-brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#F8FAFC;letter-spacing:-.01em}
.sb-brand-sub{font-size:10px;color:#475569;text-transform:uppercase;letter-spacing:.07em;margin-top:1px}
.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.sb-section{padding:10px 8px 4px;font-size:10px;font-weight:600;color:#3D5473;text-transform:uppercase;letter-spacing:.09em}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;color:#7A9CC4;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:var(--sidebar2);color:#C7D9EF}
.sb-item.active{background:#1E3A6E;color:#EFF6FF}
.sb-item svg{flex-shrink:0;opacity:.8}
.sb-item .badge{margin-left:auto;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700}
.badge-r{background:#7F1D1D;color:#FCA5A5}
.badge-a{background:#78350F;color:#FCD34D}
.badge-g{background:#064E3B;color:#6EE7B7}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#243450;display:flex;align-items:center;justify-content:center;color:#7A9CC4;font-size:11px;font-weight:700;flex-shrink:0}
.sb-user-name{font-size:12px;font-weight:600;color:#C7D9EF}
.sb-user-role{font-size:10.5px;color:#475569}
.role-switch{padding:8px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px}
.role-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;width:100%;text-align:left;transition:all .15s;background:var(--sidebar2);color:#7A9CC4}
.role-btn.active{background:#1E3A6E;color:#93C5FD}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--text-1);letter-spacing:-.02em}
.topbar-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.topbar-spacer{flex:1}
.content{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-secondary{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-lg{padding:12px 20px;font-size:15px;border-radius:9px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-1)}
.card-body{padding:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--text-1);line-height:1;font-variant-numeric:tabular-nums}
.kpi-delta{font-size:11.5px;font-weight:500;margin-top:4px;display:flex;align-items:center;gap:3px}
.delta-up{color:var(--success)} .delta-dn{color:var(--danger)}
.kpi-sub{font-size:11.5px;color:var(--text-3);margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.chip-green{background:var(--success-s);color:#065F46}
.chip-amber{background:var(--warning-s);color:#92400E}
.chip-red{background:var(--danger-s);color:#991B1B}
.chip-blue{background:var(--info-s);color:#1E40AF}
.chip-grey{background:var(--surface2);color:var(--text-2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip-green{color:#6EE7B7}:root:not([data-theme="light"]) .chip-amber{color:#FCD34D}:root:not([data-theme="light"]) .chip-red{color:#FCA5A5}:root:not([data-theme="light"]) .chip-blue{color:#93C5FD}}
:root[data-theme="dark"] .chip-green{color:#6EE7B7}
:root[data-theme="dark"] .chip-amber{color:#FCD34D}
:root[data-theme="dark"] .chip-red{color:#FCA5A5}
:root[data-theme="dark"] .chip-blue{color:#93C5FD}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.urg{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.urg-red{background:var(--danger);color:#fff}
.urg-yellow{background:var(--warning);color:#fff}
.urg-green{background:var(--success);color:#fff}
.urg-none{background:var(--surface2);color:var(--text-3)}
.alert-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.alert-row:last-child{border-bottom:none}
.alert-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-body{flex:1}
.alert-title{font-size:13px;font-weight:600;color:var(--text-1)}
.alert-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.alert-time{font-size:11px;color:var(--text-3);white-space:nowrap;padding-top:2px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text-2)}
.form-input,.form-select,.form-textarea{padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-1);font-size:13px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-textarea{resize:vertical;min-height:64px}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.emer-banner{background:var(--danger);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;color:#fff}
.emer-pulse{width:10px;height:10px;border-radius:50%;background:#fff;flex-shrink:0;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pipe-col{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.pipe-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pipe-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.pipe-count{width:20px;height:20px;border-radius:50%;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.pipe-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:box-shadow .15s}
.pipe-card:hover{box-shadow:var(--shadow-md)}
.pipe-card-num{font-size:10.5px;font-weight:700;color:var(--primary);margin-bottom:3px}
.pipe-card-bld{font-size:13px;font-weight:600;color:var(--text-1);line-height:1.3}
.pipe-card-desc{font-size:11.5px;color:var(--text-3);margin-top:2px}
.pipe-card-amt{font-size:13.5px;font-weight:700;color:var(--text-1);margin-top:6px;font-variant-numeric:tabular-nums}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.chart-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar-wrap{display:flex;align-items:flex-end;gap:2px;height:72px;width:100%}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:3px;transition:height .3s}
.chart-val{font-size:10.5px;font-weight:600;color:var(--text-2);text-align:center;font-variant-numeric:tabular-nums}
.chart-lbl{font-size:10px;color:var(--text-3);text-align:center}
.chart-legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}
.leg-dot{width:8px;height:8px;border-radius:2px}
.idx-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;gap:10px;flex-wrap:wrap}
.idx-label{font-size:13px;font-weight:600;color:var(--text-1)}
.idx-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.idx-pct{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding:4px 0 2px}
.notice{border-radius:8px;padding:12px 14px;font-size:13px}
.notice-info{background:var(--info-s);color:#1E40AF}
.notice-warning{background:var(--warning-s);color:#78350F}
.notice-danger{background:var(--danger-s);color:#7F1D1D}
.notice-success{background:var(--success-s);color:#065F46}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .notice-info{color:#93C5FD}
  :root:not([data-theme="light"]) .notice-warning{color:#FCD34D}
  :root:not([data-theme="light"]) .notice-danger{color:#FCA5A5}
  :root:not([data-theme="light"]) .notice-success{color:#6EE7B7}
}
:root[data-theme="dark"] .notice-info{color:#93C5FD}
:root[data-theme="dark"] .notice-warning{color:#FCD34D}
:root[data-theme="dark"] .notice-danger{color:#FCA5A5}
:root[data-theme="dark"] .notice-success{color:#6EE7B7}
.notice strong{font-weight:700}
#toast{position:fixed;bottom:20px;right:20px;background:#0F172A;color:#F1F5F9;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);z-index:999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
.theme-btn{width:34px;height:34px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2)}
.wf-steps{display:flex;gap:0;margin-bottom:8px;overflow-x:auto}
.wf-step{flex:1;min-width:100px;padding:10px 14px;font-size:11px;font-weight:600;text-align:center;position:relative;background:var(--surface2);color:var(--text-3);border-bottom:3px solid var(--border);white-space:nowrap}
.wf-step.wf-done{background:var(--success-s);color:#065F46;border-bottom-color:var(--success)}
.wf-step.wf-active{background:var(--primary-s);color:var(--primary);border-bottom-color:var(--primary)}
.portal-hero{background:linear-gradient(135deg,#1E3A6E,var(--primary));border-radius:14px;padding:28px 24px;color:#fff}
.portal-hero h2{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px}
.portal-hero p{font-size:14px;opacity:.85}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:0;overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover:not(.active){color:var(--text-2)}
.parts-row{display:grid;grid-template-columns:2fr 60px 100px 100px 40px;gap:8px;align-items:center;padding:6px 0}
.parts-row input{padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-1);font-size:12px}
.parts-row .del-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(6,10,20,.55);display:flex;align-items:flex-start;justify-content:center;z-index:500;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;box-shadow:var(--shadow-md);border:1px solid var(--border);max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text-3);font-size:20px;line-height:1;width:28px;height:28px;border-radius:6px}
.modal-close:hover{background:var(--surface2)}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.switch{position:relative;display:inline-block;width:38px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch-slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:22px;transition:.2s}
.switch-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.switch-slider{background:var(--success)}
.switch input:checked+.switch-slider::before{transform:translateX(16px)}
.avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--primary-s);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:140px repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal-cell{background:var(--surface);padding:8px;min-height:54px;font-size:11px}
.cal-head{background:var(--surface2);font-weight:700;text-align:center;font-size:11px;color:var(--text-3);text-transform:uppercase;padding:8px 4px}
.cal-name{background:var(--surface2);font-weight:600;font-size:12px;display:flex;align-items:center;padding:8px}
.shift-pill{display:block;padding:3px 6px;border-radius:5px;font-size:10px;font-weight:700;margin-bottom:2px;cursor:pointer;text-align:center}
.stock-low{color:var(--danger);font-weight:700}
.photo-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photo-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
.photo-thumb:hover{box-shadow:var(--shadow-md)}
.photo-upload-zone{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s;background:var(--surface2)}
.photo-upload-zone:hover{border-color:var(--primary)}
.report-chart-bar{display:inline-block;border-radius:3px 3px 0 0;min-width:18px;background:var(--primary);transition:height .3s}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;text-align:center}
.mini-cal-head{font-weight:700;color:var(--text-3);padding:4px 2px}
.mini-cal-day{padding:4px 2px;border-radius:4px;color:var(--text-3)}
.mini-cal-day.has-activity{background:var(--primary-s);color:var(--primary);font-weight:700}
.mini-cal-day.today{outline:2px solid var(--primary);outline-offset:-1px}
@media print{
  .sidebar,.topbar,.mobile-nav,.role-switch,#toast,#modal-root,.btn,.no-print{display:none!important}
  .main{margin-left:0!important}
  .app{display:block}
  body{background:#fff!important;color:#000!important;font-size:12pt}
  .card{box-shadow:none!important;border:1px solid #ddd!important}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:70px}
  .topbar{height:52px;padding:0 16px}
  .content{padding:14px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-value{font-size:22px}
  .grid2,.grid3{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(2,1fr)}
  .form-grid2,.form-grid3{grid-template-columns:1fr}

function fmt(n){ return '$'+Math.round(n||0).toLocaleString('es-AR'); }
function fmtDate(d){ if(!d) return '—'; const[y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function persist(){ try{localStorage.setItem('at_v2',JSON.stringify({view:S.view,role:S.role,clientBid:S.clientBid,data:S.data,theme:S.theme,tab:S.tab}));}catch(e){} }
function restore(){
  try{
    const raw=localStorage.getItem('at_v2');
    if(raw){const d=JSON.parse(raw);S.view=d.view||'dashboard';S.role=d.role||'admin';S.clientBid=d.clientBid||1;S.theme=d.theme||'system';S.tab=d.tab||{};if(d.data) Object.assign(S.data,d.data);}
  }catch(e){}
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function toggleTheme(){
  const order=['system','light','dark']; const i=order.indexOf(S.theme);
  S.theme=order[(i+1)%order.length];
  applyTheme(); persist();
}
function applyTheme(){
  if(S.theme==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',S.theme);
}

/* ═══════════════ PHOTO UPLOAD HELPER ═══════════════ */
function handlePhotoUpload(inputId,callback){
  const input=document.getElementById(inputId);
  if(!input||!input.files||!input.files.length) return;
  const files=Array.from(input.files);
  const maxFiles=5;
  const toProcess=files.slice(0,maxFiles);
  const results=[];
  let done=0;
  toProcess.forEach(file=>{
    if(!file.type.startsWith('image/')){done++;return;}
    const reader=new FileReader();
    reader.onload=function(e){
      results.push(e.target.result);
      done++;
      if(done===toProcess.length && callback) callback(results);
    };
    reader.readAsDataURL(file);
  });
  if(toProcess.length===0 && callback) callback([]);
}

/* ═══════════════ VIEW ROUTER ═══════════════
   NOTE: view functions (viewDashboard, viewPersonal, ...) are defined in the
   second <script> block below. VIEWS() is a function (not a top-level const)
   so the identifier lookup happens lazily at render time, after both script
   blocks have executed — referencing them eagerly here would throw a
   ReferenceError since this script block runs first. */
function VIEWS(){ return {
  dashboard:viewDashboard, personal:viewPersonal, edificios:viewEdificios, contratos:viewContratos,
  turnos:viewTurnos, recepcion:viewRecepcion, ordenes:viewOrdenesT, informes:viewInformesTecnicos,
  historial:viewHistorial, deposito:viewDeposito, pedidos:viewPedidosRepuestos, presupuestos:viewPresupuestos,
  facturacion:viewFacturacion, cobros:viewCobros, indices:viewIndices, alertas:viewAlertas,
  portal:viewPortal, portal_contrato:viewPortalContrato, portal_solicitudes:viewPortalSolicitudes, portal_cuenta:viewPortalCuenta,
  reportes:viewReportes,
};}
function renderApp(){
  applyTheme();
  /* ── Permission guard ── */
  const allowed=ALLOWED_VIEWS[S.role];
  if(allowed && !allowed.includes(S.view)){
    S.view=ROLE_DEFAULT[S.role]||'dashboard';
  }
  renderNav();
  const t=TITLES[S.view]||['AscensorTech',''];
  document.getElementById('topbar-title').textContent=t[0];
  document.getElementById('topbar-sub').textContent=t[1];
  document.getElementById('topbar-actions').innerHTML='';
  const fn=VIEWS()[S.view]||viewDashboard;
  document.getElementById('content').innerHTML=fn();
}
</script>

/* ═══════════════ VIEW: TURNOS ═══════════════ */
function viewTurnos(){
  const staff=S.data.staff.filter(s=>s.active);
  const start=S.tab.turnosWeekStart?new Date(S.tab.turnosWeekStart):(()=>{const d=new Date('2026-08-31');d.setDate(d.getDate()-d.getDay()+1);return d;})();
  const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
  const dayNames=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const shiftColor={mañana:'var(--info-s)',tarde:'var(--warning-s)',guardia:'var(--danger-s)',franco:'var(--surface2)'};
  const shiftText={mañana:'#1E40AF',tarde:'#92400E',guardia:'#991B1B',franco:'var(--text-3)'};

  function shiftLabel(t){ return {mañana:'Mañana',tarde:'Tarde',guardia:'Guardia',franco:'Franco'}[t]||t; }

  let grid=`<div class="cal-cell cal-head" style="background:var(--surface2)">Técnico</div>`;
  days.forEach((d,i)=>grid+=`<div class="cal-head">${dayNames[i]}<br><span class="text-muted" style="font-weight:400">${d.getDate()}/${d.getMonth()+1}</span></div>`);
  staff.forEach(s=>{
    grid+=`<div class="cal-name">${s.full_name}</div>`;
    days.forEach(d=>{
      const ds=d.toISOString().slice(0,10);
      const sh=S.data.shifts.find(x=>x.staff_id===s.id&&x.shift_date===ds);
      grid+=`<div class="cal-cell" style="cursor:pointer" onclick="openShiftModal(${s.id},'${ds}')">${sh?`<span class="shift-pill" style="background:${shiftColor[sh.shift_type]};color:${shiftText[sh.shift_type]}">${shiftLabel(sh.shift_type)}</span>`:'<span class="text-xs text-muted">+ agregar</span>'}</div>`;
    });
  });

  return `
  <div class="flex items-center gap-2">
    <button class="btn btn-secondary btn-sm" onclick="shiftWeek(-7)">← Semana anterior</button>
    <button class="btn btn-secondary btn-sm" onclick="shiftWeek(7)">Semana siguiente →</button>
    <span class="text-sm text-muted ml-auto">${days[0].toLocaleDateString('es-AR')} — ${days[6].toLocaleDateString('es-AR')}</span>
  </div>
  <div class="table-wrap"><div class="cal-grid">${grid}</div></div>
  <div class="chart-legend">${Object.keys(shiftColor).map(k=>`<div class="leg-item"><span class="leg-dot" style="background:${shiftColor[k]}"></span>${shiftLabel(k)}</div>`).join('')}</div>`;
}
function shiftWeek(days){

function submitTechReport(id){
  const r=req(id);
  const parts=(S.tab.partsBuf||[]).filter(p=>p.description);
  const tr={id:S.data.nextIds.report++,request_id:id,repair_type:document.getElementById('tr_repair').value||'Reparación general',hours:+document.getElementById('tr_hours').value||0,rate:+document.getElementById('tr_rate').value||0,observations:document.getElementById('tr_obs').value,parts,photos:S.tab.photoBuf||[]};
  S.data.tech_reports.push(tr);
  r.status='reported';
  // create parts request if there are parts — goes to jefe_tecnico for approval
  if(parts.length){
    const prId=S.data.nextIds.partsreq++;
    S.data.parts_requests.push({id:prId,request_id:id,tech_report_id:tr.id,items:parts.map(p=>({description:p.description,quantity:p.quantity,unit_price:p.unit_price,source:null,status:'pendiente_aprobacion'})),status:'pendiente_aprobacion',created_at:new Date().toISOString().slice(0,10)});
    S.data.alerts.unshift({id:Math.max(0,...S.data.alerts.map(a=>a.id))+1,type:'warning',title:'Nuevo pedido de repuestos requiere aprobación',description:`Pedido #${prId} — ${r.display_id} · ${bld(r.building_id).name} — ${parts.length} ítem(s)`,time_label:'Ahora'});
  }
  S.data.maintenance_log.push({id:S.data.nextIds.log++,elevator_id:r.elevator_id,request_id:r.id,tech_id:r.assigned_tech_id,log_date:new Date().toISOString().slice(0,10),log_type:'correctivo',description:tr.repair_type,equipment_status:'en_reparacion',observations:tr.observations});
  S.tab.techDetail=null; S.tab.partsBuf=null; S.tab.photoBuf=null;
  persist(); renderApp(); toast('Informe técnico guardado');
}

/* ═══════════════ VIEW: PRESUPUESTOS ═══════════════ */
function calcBudget(r){
  const tr=S.data.tech_reports.find(t=>t.request_id===r.id);
  if(!tr) return 0;
  const materials=tr.parts.reduce((a,p)=>a+p.quantity*p.unit_price,0);
  const labor=tr.hours*tr.rate;
  return Math.round((materials+labor)*1.22);
}
function viewPresupuestos(){
  const cols=[

  return `
  <div class="pipeline">

function sendBudget(id){

/* ═══════════════ VIEW: PEDIDOS DE REPUESTOS ═══════════════ */
function viewPedidosRepuestos(){
  const all=S.data.parts_requests.slice().sort((a,b)=>b.id-a.id);
  const isTech=S.role==='tecnico';
  const isJefe=S.role==='jefe_tecnico';
  const pendingApproval=all.filter(p=>p.status==='pendiente_aprobacion');
  const active=all.filter(p=>!['pendiente_aprobacion','entregado','presupuesto_rechazado'].includes(p.status));
  const completed=all.filter(p=>['entregado','presupuesto_rechazado'].includes(p.status));

  function renderPrCard(pr){
    const r=req(pr.request_id);
    const isPending=pr.status==='pendiente_aprobacion';
    const canManageItems=!isTech && !isPending;
    return `<div class="alert-row" style="align-items:stretch;flex-wrap:wrap">
      <div class="alert-ico" style="background:var(--surface2)">${I.truck}</div>
      <div class="alert-body" style="min-width:0">
        <div class="flex items-center gap-2" style="flex-wrap:wrap"><span class="alert-title">Pedido #${pr.id} — ${r?r.display_id:'—'} · ${r?bld(r.building_id).name:''}</span><span class="chip ${PR_STATUS[pr.status]?.chip||'chip-grey'}">${PR_STATUS[pr.status]?.label||pr.status}</span>
        ${pr.status==='entregado'?`<button class="btn btn-secondary btn-sm" onclick="printReport('remito',${pr.id})" title="Imprimir remito">${I.file} Remito</button>`:''}
        ${isPending && isJefe?`<button class="btn btn-success btn-sm" onclick="approvePartsRequest(${pr.id})">Aprobar</button><button class="btn btn-danger btn-sm" onclick="rejectPartsRequest(${pr.id})">Rechazar</button>`:''}
        </div>
        <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Repuesto</th><th>Cant.</th><th>Origen</th><th>Estado</th>${canManageItems?'<th></th>':''}</tr></thead><tbody>
        ${pr.items.map((it,i)=>`<tr>
          <td>${it.description}</td><td>${it.quantity}</td>
          <td>${it.source?`<span class="chip ${it.source==='deposito'?'chip-blue':'chip-amber'}">${it.source}</span>`:'<span class="text-xs text-muted">Pendiente</span>'}</td>
          <td><span class="chip ${PR_STATUS[it.status]?.chip||'chip-grey'}">${PR_STATUS[it.status]?.label||it.status}</span></td>
          ${canManageItems?`<td><select class="form-select" style="font-size:11px;padding:4px 8px" onchange="updatePartsItemStatus(${pr.id},${i},this.value)">
            ${Object.keys(PR_STATUS).map(s=>`<option value="${s}" ${it.status===s?'selected':''}>${PR_STATUS[s].label}</option>`).join('')}
          </select></td>`:''}
        </tr>`).join('')}
        </tbody></table></div>
        ${r?`<details style="margin-top:8px"><summary style="font-size:11px;font-weight:600;color:var(--primary);cursor:pointer">Ver timeline de intervención</summary>${renderInterventionTimeline(r.id)}</details>`:''}
      </div>
      <div class="alert-time">${fmtDate(pr.created_at)}</div>
    </div>`;
  }

  return `
  ${pendingApproval.length?`<div class="card" style="border-left:4px solid var(--warning)">
    <div class="card-header"><span class="card-title">Pendientes de aprobación (${pendingApproval.length})</span><span class="chip chip-amber">${pendingApproval.length}</span></div>
    ${pendingApproval.map(renderPrCard).join('')}
  </div>`:''}
  ${active.length?`<div class="card">
    <div class="card-header"><span class="card-title">En proceso (${active.length})</span></div>
    ${active.map(renderPrCard).join('')}
  </div>`:''}
  ${completed.length?`<div class="card">
    <div class="card-header"><span class="card-title">Finalizados (${completed.length})</span></div>
    ${completed.map(renderPrCard).join('')}
  </div>`:''}
  ${all.length===0?'<div class="card"><div class="card-body" style="text-align:center;color:var(--text-3);padding:32px">Sin pedidos de repuestos.</div></div>':''}`;
}
function updatePartsItemStatus(prId,itemIdx,status){
  const pr=S.data.parts_requests.find(x=>x.id===prId);
  const item=pr.items[itemIdx];
  const wasDelivered=item.status==='entregado';
  item.status=status;
  if(status==='entregado' && !wasDelivered && item.source==='deposito'){
    const inv=S.data.inventory.find(i=>i.name===item.description);
    if(inv){ inv.quantity=Math.max(0,inv.quantity-item.quantity); S.data.inventory_movements.push({id:S.data.nextIds.mov++,inventory_id:inv.id,type:'salida',quantity:item.quantity,date:new Date().toISOString().slice(0,10),tech_id:null,request_id:pr.request_id,building_id:req(pr.request_id)?.building_id||null,notes:'Entrega de pedido #'+pr.id}); }
  }
  // Derive overall PR status considering new workflow statuses
  if(pr.items.every(i=>i.status==='entregado')){
    pr.status = (pr.status==='presupuesto_aprobado'||pr.status==='entregado') ? 'entregado' : 'entregado';
  } else if(pr.items.some(i=>i.status==='en_compras')){
    pr.status = pr.status==='presupuesto_aprobado'?'presupuesto_aprobado':'en_compras';
  } else if(pr.items.some(i=>i.status==='en_deposito')){
    pr.status = pr.status==='presupuesto_aprobado'?'presupuesto_aprobado':'en_deposito';
  } else {
    // keep current higher-level status if applicable
    if(!['presupuesto_aprobado','presupuesto_enviado','presupuesto_rechazado','aprobado_jefe'].includes(pr.status)){
      pr.status='solicitado';
    }
  }
  persist(); renderApp(); toast('Estado del pedido actualizado');
}

/* ═══════════════ PARTS REQUEST APPROVAL WORKFLOW ═══════════════ */
function approvePartsRequest(prId){
  const pr=S.data.parts_requests.find(x=>x.id===prId);
  if(!pr) return;
  const r=req(pr.request_id);
  // Check inventory for each item and set source
  pr.items.forEach(item=>{
    const inv=S.data.inventory.find(i=>i.name===item.description && i.quantity>=item.quantity);
    if(inv){
      item.source='deposito';
      item.status='en_deposito';
    } else {
      item.source='compras';
      item.status='en_compras';
    }
  });
  pr.status='aprobado_jefe';
  // Auto-generate budget for the related request
  if(r && !r.in_abono){
    const tr=S.data.tech_reports.find(t=>t.request_id===r.id);
    if(tr){
      const materials=tr.parts.reduce((a,p)=>a+p.quantity*p.unit_price,0);
      const labor=tr.hours*tr.rate;
      r.budget_amount=Math.round((materials+labor)*1.22);
      r.status='budget_sent';
      pr.status='presupuesto_enviado';
    }
  }
  S.data.alerts.unshift({id:Math.max(0,...S.data.alerts.map(a=>a.id))+1,type:'info',title:'Pedido de repuestos aprobado',description:`Pedido #${prId} aprobado por Jefe Técnico — ${pr.items.filter(i=>i.source==='deposito').length} de depósito, ${pr.items.filter(i=>i.source==='compras').length} a compras${r?' · Presupuesto enviado al cliente':''}`,time_label:'Ahora'});
  persist(); renderApp(); toast('Pedido aprobado — presupuesto generado y enviado al cliente');
}
function rejectPartsRequest(prId){
  const pr=S.data.parts_requests.find(x=>x.id===prId);
  if(!pr) return;
  pr.status='presupuesto_rechazado';
  pr.items.forEach(item=>{ item.status='presupuesto_rechazado'; item.source=null; });
  S.data.alerts.unshift({id:Math.max(0,...S.data.alerts.map(a=>a.id))+1,type:'danger',title:'Pedido de repuestos rechazado',description:`Pedido #${prId} rechazado por Jefe Técnico`,time_label:'Ahora'});
  persist(); renderApp(); toast('Pedido rechazado');
}
function clientApproveParts(prId){
  const pr=S.data.parts_requests.find(x=>x.id===prId);
  if(!pr) return;
  const r=req(pr.request_id);
  pr.status='presupuesto_aprobado';
  if(r){ r.status='approved'; }
  S.data.alerts.unshift({id:Math.max(0,...S.data.alerts.map(a=>a.id))+1,type:'info',title:'Cliente aprobó presupuesto de repuestos',description:`Pedido #${prId}${r?' · '+r.display_id+' · '+bld(r.building_id).name:''} — Aprobado por el cliente`,time_label:'Ahora'});
  persist(); renderApp(); toast('Presupuesto aprobado por el cliente');
}
function clientRejectParts(prId){
  const pr=S.data.parts_requests.find(x=>x.id===prId);
  if(!pr) return;
  const r=req(pr.request_id);
  pr.status='presupuesto_rechazado';
  if(r){ r.status='rejected'; }
  S.data.alerts.unshift({id:Math.max(0,...S.data.alerts.map(a=>a.id))+1,type:'danger',title:'Cliente rechazó presupuesto de repuestos',description:`Pedido #${prId}${r?' · '+r.display_id:''} — Rechazado por el cliente`,time_label:'Ahora'});
  persist(); renderApp(); toast('Presupuesto rechazado por el cliente');
}

/* ═══════════════ INTERVENTION TIMELINE ═══════════════ */
function renderInterventionTimeline(requestId){
  const r=req(requestId);
  if(!r) return '';
  const tr=S.data.tech_reports.find(t=>t.request_id===requestId);
  const pr=S.data.parts_requests.find(p=>p.request_id===requestId);
  const ot=S.data.work_orders.find(o=>o.request_id===requestId);
  const steps=[];
  // 1. Request created
  steps.push({label:'Solicitud creada',detail:r.display_id+' — '+fmtDate(r.created_at),done:true,icon:I.send});
  // 2. Classified
  const classified=['triaged','technical','reported','budgeted','budget_sent','approved','rejected','ot_created','completed'].includes(r.status);
  steps.push({label:'Clasificado / Triaje',detail:classified?(r.urgency?URG_LABEL[r.urgency]:'Clasificado'):'Pendiente',done:classified,icon:I.inbox});
  // 3. Tech assigned
  const techAssigned=!!r.assigned_tech_id;
  steps.push({label:'Técnico asignado',detail:techAssigned?(staffOf(r.assigned_tech_id)?.full_name||'Asignado'):'Pendiente',done:techAssigned,icon:I.user});
  // 4. Tech report
  steps.push({label:'Informe técnico',detail:tr?tr.repair_type:'Pendiente',done:!!tr,icon:I.tool});
  // 5. Parts requested
  if(pr){
    steps.push({label:'Repuestos solicitados',detail:`Pedido #${pr.id} — ${pr.items.length} ítem(s)`,done:true,icon:I.truck});
    // 6. Jefe approved
    const jefeApproved=!['pendiente_aprobacion'].includes(pr.status) && pr.status!=='presupuesto_rechazado';
    steps.push({label:'Aprobación Jefe Técnico',detail:pr.status==='pendiente_aprobacion'?'Pendiente de aprobación':(pr.status==='presupuesto_rechazado'?'Rechazado':'Aprobado'),done:jefeApproved,icon:I.check});
    // 7. Stock check
    if(jefeApproved && pr.status!=='presupuesto_rechazado'){
      const depCount=pr.items.filter(i=>i.source==='deposito').length;
      const compCount=pr.items.filter(i=>i.source==='compras').length;
      steps.push({label:'Control de stock',detail:`${depCount} en depósito, ${compCount} a compras`,done:true,icon:I.box});
    }
    // 8. Budget sent to client
    const budgetSent=['presupuesto_enviado','presupuesto_aprobado','entregado'].includes(pr.status)||['budget_sent','approved','ot_created','completed'].includes(r.status);
    steps.push({label:'Presupuesto enviado al cliente',detail:budgetSent?(r.budget_amount?fmt(r.budget_amount):'Enviado'):'Pendiente',done:budgetSent,icon:I.dollar});
    // 9. Client decision
    const clientApproved=['presupuesto_aprobado','entregado'].includes(pr.status)||['approved','ot_created','completed'].includes(r.status);
    const clientRejected=pr.status==='presupuesto_rechazado'||r.status==='rejected';
    steps.push({label:'Decisión del cliente',detail:clientApproved?'Aprobado':(clientRejected?'Rechazado':'Esperando respuesta'),done:clientApproved||clientRejected,icon:I.user});
  } else {
    // Budget flow without parts
    const budgeted=['budgeted','budget_sent','approved','rejected','ot_created','completed'].includes(r.status);
    steps.push({label:'Presupuesto',detail:budgeted?(r.budget_amount?fmt(r.budget_amount):'Generado'):'Pendiente',done:budgeted,icon:I.dollar});
    const clientDecided=['approved','rejected','ot_created','completed'].includes(r.status);
    steps.push({label:'Decisión del cliente',detail:r.status==='approved'||r.status==='ot_created'||r.status==='completed'?'Aprobado':(r.status==='rejected'?'Rechazado':'Pendiente'),done:clientDecided,icon:I.user});
  }
  // OT
  steps.push({label:'Orden de trabajo',detail:ot?ot.display_id+' — '+(OT_STATUS[ot.status]?.label||ot.status):'Pendiente',done:!!ot,icon:I.clipboard});
  // Completed
  steps.push({label:'Completado',detail:r.status==='completed'?'Finalizado':'Pendiente',done:r.status==='completed',icon:I.check});

  return `<div style="display:flex;flex-direction:column;gap:0;margin:8px 0">
    ${steps.map((s,i)=>`<div style="display:flex;gap:10px;align-items:flex-start;position:relative">
      <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px">
        <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${s.done?'var(--success)':'var(--surface2)'};color:${s.done?'#fff':'var(--text-3)'};border:2px solid ${s.done?'var(--success)':'var(--border)'};flex-shrink:0">${s.icon||''}</div>
        ${i<steps.length-1?`<div style="width:2px;height:24px;background:${s.done?'var(--success)':'var(--border)'}"></div>`:''}
      </div>
      <div style="padding-bottom:${i<steps.length-1?'8px':'0'}">
        <div style="font-size:12px;font-weight:600;color:${s.done?'var(--text-1)':'var(--text-3)}'}">${s.label}</div>
        <div style="font-size:11px;color:var(--text-3)">${s.detail}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

}

        ${pr?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div class="flex items-center gap-2" style="margin-bottom:6px"><span class="fw600 text-sm">Estado de repuestos</span><span class="chip ${PR_STATUS[pr.status]?.chip||'chip-grey'}">${PR_STATUS[pr.status]?.label||pr.status}</span></div>
          <div class="table-wrap"><table style="font-size:12px"><thead><tr><th>Repuesto</th><th>Cant.</th><th>Estado</th></tr></thead><tbody>
          ${pr.items.map(it=>`<tr><td>${it.description}</td><td>${it.quantity}</td><td><span class="chip ${PR_STATUS[it.status]?.chip||'chip-grey'}">${PR_STATUS[it.status]?.label||it.status}</span></td></tr>`).join('')}
          </tbody></table></div>
        </div>`:''}
        ${amt&&!r.in_abono&&['budgeted','budget_sent','approved','rejected','ot_created','completed'].includes(r.status)?`
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div><div class="fw600">Presupuesto: ${fmt(amt)}</div><div class="text-xs text-muted">${tr?.repair_type||'—'}</div></div>
          ${showApproval?`<div class="flex gap-2"><button class="btn btn-danger btn-sm" onclick="clientDecision(${r.id},false);">Rechazar</button><button class="btn btn-success" onclick="clientDecision(${r.id},true);">Aprobar presupuesto</button></div>`
          :`<span class="chip ${r.status==='approved'||r.status==='ot_created'||r.status==='completed'?'chip-green':r.status==='rejected'?'chip-red':'chip-grey'}">${r.status==='rejected'?'Rechazado':(r.status==='approved'||r.status==='ot_created'||r.status==='completed')?'Aprobado':'Procesando'}</span>`}
        </div>`:''}
        ${r.in_abono?`<div class="notice notice-success"><strong>Incluido en su abono mensual.</strong> No requiere aprobación adicional.</div>`:''}
        <details style="margin-top:4px"><summary style="font-size:11px;font-weight:600;color:var(--primary);cursor:pointer">Ver timeline de intervención</summary>${renderInterventionTimeline(r.id)}</details>
      </div>
    </div>`;
  }).join('')}
  ${myReqs.length===0?`<div class="card"><div class="card-body" style="text-align:center;color:var(--text-3);padding:40px">No tiene solicitudes registradas.</div></div>`:''}`;
}

  const elevs=S.data.elevators.filter(e=>e.building_id===S.clientBid);
  openModal('Nueva Solicitud de Asistencia',`
    <div class="form-grid2">
      <div class="form-group"><label class="form-label">Ascensor</label><select class="form-select" id="f_eid">${elevs.map(e=>`<option value="${e.id}">Ascensor #${e.number}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Tipo de problema</label><select class="form-select" id="f_type">${Object.keys(TYPE_LABEL).map(t=>`<option value="${t}">${TYPE_LABEL[t]}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-textarea" id="f_desc" rows="4"></textarea></div>
    <div class="form-grid2">
      <div class="form-group"><label class="form-label">Contacto</label><input class="form-input" id="f_contact" value="${b.admin_name}"></div>
      <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="f_phone" value="${b.phone}"></div>
    </div>
    <div class="form-group"><label class="form-label">Fotos (opcional)</label>
      <input type="file" id="f_photos" accept="image/*" multiple class="form-input" style="padding:6px">
    </div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitClientRequest()">Enviar</button>`);
}
function submitClientRequest(){
  const v={building_id:S.clientBid,elevator_id:+document.getElementById('f_eid').value,type:document.getElementById('f_type').value,description:document.getElementById('f_desc').value,contact_name:document.getElementById('f_contact').value,contact_phone:document.getElementById('f_phone').value,urgency:document.getElementById('f_type').value==='emergencia_personas'?'red':null,status:document.getElementById('f_type').value==='emergencia_personas'?'triaged':'new',assigned_tech_id:null,assigned_supervisor_id:null,in_abono:false,budget_amount:0,photos:[],created_at:new Date().toISOString().slice(0,10)};
  v.id=Math.max(0,...S.data.requests.map(r=>r.id))+1; v.display_id='REQ-'+String(S.data.nextReqId++).padStart(4,'0');
  const photoInput=document.getElementById('f_photos');
  if(photoInput&&photoInput.files&&photoInput.files.length){
    const files=Array.from(photoInput.files).slice(0,5);
    let done=0;
    files.forEach(file=>{
      if(!file.type.startsWith('image/')){done++;return;}
      const reader=new FileReader();
      reader.onload=function(e){v.photos.push(e.target.result);done++;
        if(done===files.length){S.data.requests.push(v);closeModal();persist();renderApp();toast(`Solicitud ${v.display_id} enviada`);}};
      reader.readAsDataURL(file);
    });
    if(files.length===0){S.data.requests.push(v);closeModal();persist();renderApp();toast(`Solicitud ${v.display_id} enviada`);}
  } else {
    S.data.requests.push(v);closeModal();persist();renderApp();toast(`Solicitud ${v.display_id} enviada`);
  }
}

/* ═══════════════ VIEW: REPORTES ═══════════════ */
function viewReportes(){
  const presets=[
    {label:'Hoy',from:new Date().toISOString().slice(0,10),to:new Date().toISOString().slice(0,10)},
    {label:'Esta semana',from:(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+1);return d.toISOString().slice(0,10)})(),to:new Date().toISOString().slice(0,10)},
    {label:'Este mes',from:new Date().toISOString().slice(0,8)+'01',to:new Date().toISOString().slice(0,10)},
    {label:'Último trimestre',from:(()=>{const d=new Date();d.setMonth(d.getMonth()-3);return d.toISOString().slice(0,10)})(),to:new Date().toISOString().slice(0,10)},
  ];
  const from=S.tab.repFrom||presets[2].from;
  const to=S.tab.repTo||presets[2].to;
  const d=S.data;
  const filtered=d.requests.filter(r=>r.created_at>=from&&r.created_at<=to);
  const completed=filtered.filter(r=>r.status==='completed');
  const totalBilled=d.invoices.filter(f=>f.created_at>=from&&f.created_at<=to).reduce((a,f)=>a+f.amount,0);
  const partsUsed=d.inventory_movements.filter(m=>m.date>=from&&m.date<=to&&m.type==='salida').reduce((a,m)=>a+m.quantity,0);
  const avgDays=completed.length?Math.round(completed.reduce((a,r)=>{
    const created=new Date(r.created_at);const now=new Date();return a+((now-created)/(86400000));
  },0)/completed.length):0;

  // Requests by day for chart
  const dayMap={};
  filtered.forEach(r=>{dayMap[r.created_at]=(dayMap[r.created_at]||0)+1;});
  const dayKeys=Object.keys(dayMap).sort();
  const maxDay=Math.max(1,...Object.values(dayMap));
  const chartBars=dayKeys.map(k=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:24px"><div style="height:${(dayMap[k]/maxDay*80)}px" class="report-chart-bar"></div><div style="font-size:10px;font-weight:600;color:var(--text-2)">${dayMap[k]}</div><div style="font-size:9px;color:var(--text-3)">${k.slice(5)}</div></div>`).join('');

  // Breakdown by type
  const byType={};
  filtered.forEach(r=>{byType[r.type]=(byType[r.type]||0)+1;});
  const typeRows=Object.entries(byType).map(([t,c])=>`<tr><td>${TYPE_LABEL[t]||t}</td><td class="fw600">${c}</td><td>${Math.round(c/Math.max(1,filtered.length)*100)}%</td></tr>`).join('');

  // Breakdown by building
  const byBld={};
  filtered.forEach(r=>{const n=bld(r.building_id).name;byBld[n]=(byBld[n]||0)+1;});
  const bldRows=Object.entries(byBld).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<tr><td>${n}</td><td class="fw600">${c}</td></tr>`).join('');

  // Breakdown by tech
  const byTech={};
  filtered.forEach(r=>{if(r.assigned_tech_id){const n=staffOf(r.assigned_tech_id)?.full_name||'—';byTech[n]=(byTech[n]||0)+1;}});
  const techRows=Object.entries(byTech).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<tr><td>${n}</td><td class="fw600">${c}</td></tr>`).join('');

  // Mini calendar
  const calStart=new Date(from);
  const calEnd=new Date(to);
  const todayStr=new Date().toISOString().slice(0,10);
  const activityDays=new Set(filtered.map(r=>r.created_at));
  // Start from first day of the month of 'from'
  const calMonthStart=new Date(calStart.getFullYear(),calStart.getMonth(),1);
  const calMonthEnd=new Date(calStart.getFullYear(),calStart.getMonth()+1,0);
  let calCells='';
  const dayLabels=['L','M','X','J','V','S','D'];
  calCells+=dayLabels.map(l=>`<div class="mini-cal-head">${l}</div>`).join('');
  const firstDow=(calMonthStart.getDay()+6)%7;
  for(let i=0;i<firstDow;i++) calCells+=`<div class="mini-cal-day"></div>`;
  for(let dd=1;dd<=calMonthEnd.getDate();dd++){
    const ds=calMonthStart.getFullYear()+'-'+String(calMonthStart.getMonth()+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    const cls=['mini-cal-day'];
    if(activityDays.has(ds)) cls.push('has-activity');
    if(ds===todayStr) cls.push('today');
    calCells+=`<div class="${cls.join(' ')}">${dd}</div>`;
  }

  return `
  <div class="card"><div class="card-body">
    <div class="flex gap-3 items-center" style="flex-wrap:wrap">
      <div class="form-group"><label class="form-label">Desde</label><input class="form-input" type="date" value="${from}" onchange="S.tab.repFrom=this.value;renderApp()"></div>
      <div class="form-group"><label class="form-label">Hasta</label><input class="form-input" type="date" value="${to}" onchange="S.tab.repTo=this.value;renderApp()"></div>
      <div class="flex gap-2 items-center" style="margin-top:16px">${presets.map(p=>`<button class="btn btn-secondary btn-sm" onclick="S.tab.repFrom='${p.from}';S.tab.repTo='${p.to}';renderApp()">${p.label}</button>`).join('')}</div>
    </div>
  </div></div>
  <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">
    <div class="kpi"><div class="kpi-top"><div class="kpi-label">Total solicitudes</div><div class="kpi-icon" style="background:var(--info-s);color:var(--info)">${I.inbox}</div></div><div class="kpi-value">${filtered.length}</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-label">Completadas</div><div class="kpi-icon" style="background:var(--success-s);color:var(--success)">${I.check}</div></div><div class="kpi-value">${completed.length}</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-label">Tiempo prom. (días)</div><div class="kpi-icon" style="background:var(--warning-s);color:var(--warning)">${I.clock}</div></div><div class="kpi-value">${avgDays}</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-label">Total facturado</div><div class="kpi-icon" style="background:var(--success-s);color:var(--success)">${I.dollar}</div></div><div class="kpi-value" style="font-size:18px">${fmt(totalBilled)}</div></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-label">Repuestos usados</div><div class="kpi-icon" style="background:var(--info-s);color:var(--info)">${I.box}</div></div><div class="kpi-value">${partsUsed}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-header"><span class="card-title">Solicitudes en el período</span></div>
      <div class="card-body">${dayKeys.length?`<div style="display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px 0">${chartBars}</div>`:'<div class="text-sm text-muted" style="text-align:center;padding:20px">Sin datos en el período seleccionado.</div>'}</div>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">Calendario de actividad</span></div>
      <div class="card-body"><div class="mini-cal">${calCells}</div>
        <div class="flex gap-3" style="margin-top:8px"><div class="leg-item"><span class="leg-dot" style="background:var(--primary-s)"></span>Con actividad</div><div class="leg-item"><span class="leg-dot" style="outline:2px solid var(--primary);outline-offset:-1px"></span>Hoy</div></div>
      </div>
    </div>
  </div>
  <div class="grid3">
    <div class="card"><div class="card-header"><span class="card-title">Por tipo</span></div>
      <div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Cant.</th><th>%</th></tr></thead><tbody>${typeRows||'<tr><td colspan="3" class="text-muted" style="text-align:center;padding:16px">Sin datos</td></tr>'}</tbody></table></div>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">Por edificio</span></div>
      <div class="table-wrap"><table><thead><tr><th>Edificio</th><th>Cant.</th></tr></thead><tbody>${bldRows||'<tr><td colspan="2" class="text-muted" style="text-align:center;padding:16px">Sin datos</td></tr>'}</tbody></table></div>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">Por técnico</span></div>
      <div class="table-wrap"><table><thead><tr><th>Técnico</th><th>Cant.</th></tr></thead><tbody>${techRows||'<tr><td colspan="2" class="text-muted" style="text-align:center;padding:16px">Sin datos</td></tr>'}</tbody></table></div>
    </div>
  </div>`;
}

/* ═══════════════ INIT ═══════════════ */
restore();
renderApp();
</script>
